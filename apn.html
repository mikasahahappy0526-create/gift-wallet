<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">
<link rel="icon" href="./favicon.ico" sizes="any">

<title>APN設定一覧</title>

<style>
:root{
  --amber:#f5b731;--amber-d:#d49a0a;--amber-l:#fff8e1;
  --text:#1a1a2e;--text2:#444;--gray:#888;
  --white:#fff;--bg:#f7f6f2;--border:#e8e4dc;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}

/* HEADER */
.topnav{background:var(--amber);padding:0 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.back-btn{background:none;border:none;color:#fff;font-size:26px;font-weight:900;padding:12px 10px 12px 0;cursor:pointer;line-height:1;}
.nav-title{flex:1;font-size:17px;font-weight:900;color:#fff;}

/* SEARCH */
.search-wrap{padding:14px 14px 8px;}
.search-box{display:flex;gap:8px;background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 14px;align-items:center;}
.search-box input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--text);background:transparent;}
.search-box input::placeholder{color:#bbb;}
.search-icon{font-size:18px;color:var(--amber-d);}

/* FILTER TABS */
.filter-tabs{display:flex;gap:6px;padding:4px 14px 10px;overflow-x:auto;scrollbar-width:none;}
.filter-tabs::-webkit-scrollbar{display:none;}
.ftab{border:1.5px solid var(--border);border-radius:99px;padding:4px 14px;font-size:12px;font-weight:700;color:var(--gray);background:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.ftab.active{background:var(--amber);color:#fff;border-color:var(--amber);}

/* CARRIER CARDS */
.cards{padding:0 14px 80px;display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border-radius:var(--r);box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden;border:1px solid var(--border);}
.card-head{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.carrier-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;font-weight:900;color:#fff;}
.carrier-name{flex:1;}
.carrier-name-main{font-size:14px;font-weight:900;color:var(--text);}
.carrier-name-sub{font-size:10px;color:var(--gray);margin-top:1px;}
.carrier-base{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:700;}
.base-d{background:#e0f2fe;color:#0369a1;}
.base-a{background:#fef3c7;color:#b45309;}
.base-s{background:#fce7f3;color:#be185d;}
.base-r{background:#fde8e8;color:#b91c1c;}
.chevron{font-size:16px;color:#ccc;transition:transform .25s;}
.card.open .chevron{transform:rotate(180deg);}

/* APN TABLE */
.apn-body{display:none;padding:0 16px 14px;border-top:1px solid var(--border);}
.card.open .apn-body{display:block;}
.apn-section{margin-top:12px;}
.apn-section-title{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.apn-table{width:100%;border-collapse:collapse;}
.apn-table tr{border-bottom:1px solid #f0f0f0;}
.apn-table tr:last-child{border-bottom:none;}
.apn-table td{padding:7px 4px;font-size:12px;vertical-align:top;}
.apn-table td:first-child{color:var(--gray);width:38%;font-size:11px;padding-right:8px;}
.apn-table td:last-child{font-family:"DM Mono",monospace;font-size:12px;font-weight:500;color:var(--text);word-break:break-all;}
.copy-btn{background:var(--amber-l);border:1px solid #fde68a;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;color:var(--amber-d);cursor:pointer;margin-left:6px;white-space:nowrap;}
.copy-btn:active{background:var(--amber);color:#fff;}
.official-link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;background:#f8f9fa;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:11px;color:#3b82f6;text-decoration:none;font-weight:700;}
.note{font-size:11px;color:var(--gray);line-height:1.7;margin-top:8px;background:#f8f9fa;border-radius:8px;padding:8px 10px;}

/* NO RESULT */
.no-result{text-align:center;padding:40px 20px;color:var(--gray);font-size:14px;}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 20px;border-radius:99px;font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}

let activeFilter='all';

function baseClass(b){return{d:'base-d',a:'base-a',s:'base-s',r:''[b]}[b]||'base-d';}
function baseLabel(b){return{d:'ドコモ回線',a:'au回線',s:'SB回線',r:'楽天回線'}[b]||'';}

function buildCards(list){
  const cont=document.getElementById('cards');
  cont.innerHTML='';
  if(!list.length){
    cont.innerHTML='<div class="no-result">🔍 該当するキャリアが見つかりません</div>';
    return;
  }
  list.forEach(c=>{
    const card=document.createElement('div');
    card.className='card';
    card.dataset.tags=c.tags.join(' ');
    card.dataset.name=c.name;

    const sectionsHTML=c.sections.map(sec=>`
      <div class="apn-section">
        <div class="apn-section-title">${sec.title}</div>
        <table class="apn-table">
          ${sec.rows.map(r=>`
            <tr>
              <td>${r.label}</td>
              <td>${r.val}${r.val!=='（空白）'?`<button class="copy-btn" onclick="copyText('${r.val}',event)">コピー</button>`:''}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `).join('');

    card.innerHTML=`
      <div class="card-head" onclick="toggleCard(this)">
        <div class="carrier-icon" style="background:${c.color};">${c.icon}</div>
        <div class="carrier-name">
          <div class="carrier-name-main">${c.name}</div>
          <div class="carrier-name-sub">${c.sub}</div>
        </div>
        <span class="carrier-base ${baseClass(c.base)}">${baseLabel(c.base)}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="apn-body">
        ${sectionsHTML}
        ${c.note?`<div class="note">⚠️ ${c.note}</div>`:''}
        <a href="${c.url}" target="_blank" class="official-link">🔗 公式サポートページを確認</a>
      </div>
    `;
    cont.appendChild(card);
  });
}

function toggleCard(head){
  const card=head.closest('.card');
  const isOpen=card.classList.contains('open');
  document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));
  if(!isOpen)card.classList.add('open');
}

function filterCards(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered=CARRIERS.filter(c=>{
    const matchSearch=!q||c.name.toLowerCase().includes(q)||c.sub.toLowerCase().includes(q);
    const matchFilter=activeFilter==='all'||c.tags.includes(activeFilter);
    return matchSearch&&matchFilter;
  });
  buildCards(filtered);
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function copyText(txt,e){
  e.stopPropagation();
  navigator.clipboard.writeText(txt).then(()=>{
    const t=document.getElementById('toast');
    t.style.opacity='1';
    setTimeout(()=>t.style.opacity='0',1500);
  });
}

// 初期描画
